# Build and deploy static site to GitHub Pages.
# After the first successful run: Repo → Settings → Pages → Source: GitHub Actions.
# Live URL: https://jennyyangyi-magic.github.io/ai-grid-prototype/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue instead of cancel — mid-flight cancels leave Pages stuck ("Deployment cancelled").
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
